name: Deploy PCFlows site

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public site only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html privacy.html robots.txt sitemap.xml .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
