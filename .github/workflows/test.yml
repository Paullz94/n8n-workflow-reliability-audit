name: Public tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run browser and launch-gate unit tests
        run: node --test tests/*.test.js

      - name: Verify redacted report generation
        shell: bash
        run: |
          python audit.py examples/unsafe_order_intake.json \
            --output /tmp/unsafe-order.audit.md \
            --json-output /tmp/unsafe-order.audit.json
          ! grep -q "DEMO_ONLY_NOT_A_REAL_SECRET" /tmp/unsafe-order.audit.md
          ! grep -q "DEMO_ONLY_NOT_A_REAL_SECRET" /tmp/unsafe-order.audit.json


      - name: Validate public site deployment contract
        shell: bash
        run: |
          set -euo pipefail

          required=(
            index.html
            privacy.html
            legal.html
            intake.html
            site.js
            scanner.js
            seller-config.js
            launch-config.js
            legal.js
            intake.js
            robots.txt
            sitemap.xml
            .nojekyll
            guides/n8n-webhook-duplicates.html
            guides/n8n-retry-safety.html
          )

          for file in "${required[@]}"; do
            test -f "$file" || {
              echo "::error::Missing required public site file: $file"
              exit 1
            }
          done

          grep -q 'seller-config.js' index.html
          grep -q 'launch-config.js' index.html
          grep -q 'site.js' index.html
          grep -q 'scanner.js' index.html
          grep -q 'seller-config.js' legal.html
          grep -q 'legal.js' legal.html
          grep -q 'intake.js' intake.html
          grep -Eq 'checkoutEnabled:[[:space:]]*false' launch-config.js

          grep -q "seller-config.js" .github/workflows/pages.yml
          grep -q "launch-config.js" .github/workflows/pages.yml
          grep -q "site.js" .github/workflows/pages.yml
          grep -q "scanner.js" .github/workflows/pages.yml
          grep -q "legal.html" .github/workflows/pages.yml
          grep -q "intake.html" .github/workflows/pages.yml
          grep -q "guides/\\*\\.html" .github/workflows/pages.yml
