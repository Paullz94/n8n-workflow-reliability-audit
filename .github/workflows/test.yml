name: Public tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify redacted report generation
        shell: bash
        run: |
          python audit.py examples/unsafe_order_intake.json \
            --output /tmp/unsafe-order.audit.md \
            --json-output /tmp/unsafe-order.audit.json
          ! grep -q "DEMO_ONLY_NOT_A_REAL_SECRET" /tmp/unsafe-order.audit.md
          ! grep -q "DEMO_ONLY_NOT_A_REAL_SECRET" /tmp/unsafe-order.audit.json

