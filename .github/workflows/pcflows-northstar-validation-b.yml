name: PCFlows Northstar Validation B

on:
  push:
    branches:
      - northstar-validation-20260925b

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run PCFlows validation
        working-directory: northstar/make-reliability
        run: python validate.py
